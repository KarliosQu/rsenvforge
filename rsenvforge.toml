[[tools]]
name = "rust-build-base"
check_windows = "0"
check_linux = "dpkg -s build-essential pkg-config libssl-dev"
install_windows = "0"
install_linux = "apt-get update && apt-get install -y build-essential pkg-config libssl-dev"

[[tools]]
name = "rust-toolchain"
tags = []
check_windows = "rustup --version"
check_linux = "rustup --version"
install_windows = "rustup toolchain install stable && rustup component add rustfmt clippy"
install_linux = "set -o pipefail; if command -v rustup >/dev/null 2>&1; then rustup toolchain install stable && rustup component add rustfmt clippy; else curl -ssf https://rsproxy.cn/rustup-init.sh | sh -s -- -y --default-toolchain stable && . \"$HOME/.cargo/env\" && rustup component add rustfmt clippy; fi"

