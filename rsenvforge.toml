# rsenvforge 默认安装表单
#
# 安装等级会按 light -> standard -> full 累积。
# standard 会包含 light；full 会包含 light + standard + full。

# [environment.windows] 与 [environment.linux] 会分别写入对应平台的环境配置。
# cargo_config 会写入 Cargo config.toml；npmrc 会追加到用户级 .npmrc。
# Windows variables 会写入当前进程和当前用户环境变量；Linux bashrc 会追加到 ~/.bashrc。
[environment.windows]
cargo_config = [
  "[source.crates-io]",
  "replace-with = \"rsproxy\"",
  "[source.rsproxy]",
  "registry = \"sparse+https://rsproxy.cn/index/\"",
  "[net]",
  "git-fetch-with-cli = true",
]
variables = [
  "RUSTUP_DIST_SERVER=https://rsproxy.cn",
  "RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup",
]
npmrc = [
  "registry=https://registry.npmmirror.com/",
]

[environment.linux]
cargo_config = [
  "[source.crates-io]",
  "replace-with = \"rsproxy\"",
  "[source.rsproxy]",
  "registry = \"sparse+https://rsproxy.cn/index/\"",
  "[net]",
  "git-fetch-with-cli = true",
]
bashrc = [
  "export RUSTUP_DIST_SERVER=https://rsproxy.cn",
  "export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup",
  # Node.js 官方包下载模板。支持 {version}、{arch}、{platform}、{package} 变量。
  "export RSENVFORGE_NODEJS_ARCHIVE_URL=http://7.222.7.221/nodejs/v{version}/node-v{version}-linux-{arch}.tar.gz",
  # Node.js 镜像根目录。未配置 RSENVFORGE_NODEJS_ARCHIVE_URL 时，会拼接为
  # ${RSENVFORGE_NODEJS_MIRROR}/v{version}/{package}.tar.gz。
  "export RSENVFORGE_NODEJS_MIRROR=http://7.222.7.221/nodejs",
  "export RSENVFORGE_NODEJS_VERSION=20.17.0",
  "export PATH=\"$HOME/.local/bin:$PATH\"",
  ". \"$HOME/.cargo/env\"",
]
npmrc = [
  "registry=https://registry.npmmirror.com/",
]

# 分级安装前置命令同样会按等级累积执行。
[preinstall.light.linux]
commands = []

[preinstall.light.windows]
commands = []

[preinstall.standard.linux]
commands = []

[preinstall.standard.windows]
commands = []

[preinstall.full.linux]
commands = []

[preinstall.full.windows]
commands = []

[profiles.light]
tools = [
  "gnu",
  "msvc",
  "rust-build-base",
  "rust-toolchain",
  "nodejs",
]
items = []

[profiles.standard]
