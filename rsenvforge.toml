[[tools]]
name = "nodejs"
check_windows = "node --version && npm --version && node -e \"const major = Number(process.versions.node.split('.')[0]); process.exit(major >= 20 ? 0 : 1)\""
check_linux = "export PATH=\"$HOME/.local/bin:$PATH\"; version=$(node --version) || exit $?; npm --version || exit $?; echo \"$version\"; major=${version#v}; major=${major%%.*}; test \"$major\" -ge 20"
install_windows = "winget install -e --id OpenJS.NodeJS.LTS && node --version && npm --version"
install_linux = "set -o pipefail; . \"$HOME/.bashrc\" >/dev/null 2>&1 || true; version=\"${RSENVFORGE_NODEJS_VERSION:-20.17.0}\"; case \"$(uname -m)\" in x86_64|amd64) node_arch=x64 ;; aarch64|arm64) node_arch=arm64 ;; *) echo \"不支持的 Node.js 架构：$(uname -m)\"; exit 1 ;; esac; platform=linux; package=\"node-v${version}-${platform}-${node_arch}\"; archive_url=\"${RSENVFORGE_NODEJS_ARCHIVE_URL:-}\"; if [ -z \"$archive_url\" ]; then mirror=\"${RSENVFORGE_NODEJS_MIRROR:-}\"; test -n \"$mirror\" || { echo '缺少 RSENVFORGE_NODEJS_ARCHIVE_URL 或 RSENVFORGE_NODEJS_MIRROR'; exit 1; }; archive_url=\"${mirror%/}/v{version}/{package}.tar.gz\"; fi; archive_url=\"${archive_url//\\{version\\}/$version}\"; archive_url=\"${archive_url//\\{arch\\}/$node_arch}\"; archive_url=\"${archive_url//\\{platform\\}/$platform}\"; archive_url=\"${archive_url//\\{package\\}/$package}\"; case \"$archive_url\" in *.tar.xz) tar_args=-xJ ;; *.tar.gz|*.tgz) tar_args=-xz ;; *) echo \"不支持的 Node.js 压缩包格式：$archive_url\"; exit 1 ;; esac; install_dir=\"$HOME/.local/opt/$package\"; mkdir -p \"$install_dir\" \"$HOME/.local/bin\" && curl -fsSL \"$archive_url\" | tar \"$tar_args\" --strip-components=1 -C \"$install_dir\" || exit $?; ln -sf \"$install_dir/bin/node\" \"$HOME/.local/bin/node\"; ln -sf \"$install_dir/bin/npm\" \"$HOME/.local/bin/npm\"; ln -sf \"$install_dir/bin/npx\" \"$HOME/.local/bin/npx\"; touch \"$HOME/.bashrc\"; grep -q '\\$HOME/.local/bin' \"$HOME/.bashrc\" || printf '\\nexport PATH=\"$HOME/.local/bin:$PATH\"\\n' >> \"$HOME/.bashrc\"; export PATH=\"$HOME/.local/bin:$PATH\"; node_global_bin=\"$(npm prefix -g)/bin\"; grep -q \"$node_global_bin\" \"$HOME/.bashrc\" || printf '\\nexport PATH=\"%s:$PATH\"\\n' \"$node_global_bin\" >> \"$HOME/.bashrc\"; export PATH=\"$node_global_bin:$PATH\"; node --version && npm --version && node -e 'const major = Number(process.versions.node.split(\".\")[0]); process.exit(major >= 20 ? 0 : 1)'"

[[tools]]
name = "gitnexus"
tags = ["node20", "npm-mirror"]
check_windows = "echo gitnexus 平台：windows && gitnexus --version"
check_linux = "case \"$(uname -m)\" in x86_64|amd64) gitnexus_platform=linux-x64 ;; aarch64|arm64) gitnexus_platform=linux-arm64 ;; *) echo \"gitnexus 不支持当前 Linux 架构：$(uname -m)\"; exit 1 ;; esac; echo \"gitnexus 平台：$gitnexus_platform\"; gitnexus --version"
install_windows = "echo gitnexus 平台：windows && npm install -g \"http://7.222.7.221/package/gitnexus-windows-1.6.8.tgz\""
install_linux = ". \"$HOME/.bashrc\" >/dev/null 2>&1 || true; case \"$(uname -m)\" in x86_64|amd64) gitnexus_platform=linux-x64; package_url=\"http://7.222.7.221/package/gitnexus-linux-x64-1.6.8.tgz\" ;; aarch64|arm64) gitnexus_platform=linux-arm64; package_url=\"http://7.222.7.221/package/gitnexus-linux-arm64-1.6.8.tgz\" ;; *) echo \"gitnexus 不支持当前 Linux 架构：$(uname -m)\"; exit 1 ;; esac; echo \"gitnexus 平台：$gitnexus_platform\"; npm install -g \"$package_url\""

