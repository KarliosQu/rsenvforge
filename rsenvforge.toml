# rsenvforge 默认安装表单
#
# 安装等级会按 light -> standard -> full 累积。
# standard 会包含 light；full 会包含 light + standard + full。

[profiles.light]
tools = [
  "cargo-llvm-cov",
  "bindgen-cli",
  "cargo-audit",
  "cargo-deny",
  "cargo-geiger",
  "rust-analyzer",
  "miri",
  "cargo-expand",
  "cargo-fuzz",
  "cargo-udeps",
  "cargo-bloat",
  "flamegraph-rs",
  "cargo-msrv",
  "cargo-semver-checks",
  "rust-checker-cli",
  "rustbot-cli",
  "python",
  "ninja",
  "valgrind",
]
skills = []
items = []

[profiles.standard]
tools = [
  "rust-build-base",
  "rust-toolchain",
  "nvm",
  "nodejs",
  "gitnexus",
]
skills = []
items = []

[profiles.full]
tools = []
skills = []
items = []

# 分级安装前置命令同样会按等级累积执行。
[preinstall.light.linux]
commands = []

[preinstall.light.windows]
commands = []

[preinstall.standard.linux]
commands = []

[preinstall.standard.windows]
commands = []

[preinstall.full.linux]
commands = []

[preinstall.full.windows]
commands = []

# [environment] 是实际会写入本机环境文件的配置区。
# cargo_config 会写入 Cargo config.toml；bashrc 会追加到 Linux ~/.bashrc；
# npmrc 会追加到用户级 .npmrc。下面的镜像行默认保持注释，不参与安装。
[environment]
cargo_config = [
  "[source.crates-io]",
  "replace-with = \"rsproxy\"",
  "[source.rsproxy]",
  "registry = \"sparse+https://rsproxy.cn/index/\"",
  "[net]",
  "git-fetch-with-cli = true",
]
bashrc = [
  "export RUSTUP_DIST_SERVER=https://rsproxy.cn",
  "export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup",
  # NVM/Node.js 镜像示例：需要使用 nvm 下载镜像时取消注释，并改成内网地址。
  # "export NVM_NODEJS_ORG_MIRROR=https://mirror.com/nodejs",
  ". \"$HOME/.cargo/env\"",
]
npmrc = [
  "registry=https://registry.npmmirror.com/",
]

# 内部 APT 镜像配置独立于 [environment]，因为它会生成系统 APT source 文件。
# 以下内容全部保持注释状态，不参与当前测试或安装；需要启用时请选择一种方式取消注释。
# 查询当前 Linux 系统会用于匹配的值：
# . /etc/os-release
# echo "distribution=${ID}"
# echo "codename=${VERSION_CODENAME:-$UBUNTU_CODENAME}"
# echo "architecture=$(dpkg --print-architecture)"
#
# 使用前建议先执行：
# rsenvforge apt-mirror check
# 验证通过后，再执行：
# rsenvforge apt-mirror apply
#
[apt_mirror]
uri = "https://mirrors.tuna.tsinghua.edu.cn/ubuntu"
suites = ["{codename}", "{codename}-updates", "{codename}-security"]
components = ["main", "restricted", "universe", "multiverse"]
architectures = ["{architecture}"]
source_file = "/etc/apt/sources.list.d/rsenvforge.sources"

# 方式一：Deb822 .sources 模式。适合同一组 URI/suites/components 的镜像。
# [apt_mirror]
# uri = "https://apt.internal.example/{distribution}"
# suites = ["{codename}", "{codename}-updates", "{codename}-security"]
# components = ["main", "restricted", "universe", "multiverse"]
# architectures = ["{architecture}"]
# signed_by = "/usr/share/keyrings/internal-archive-keyring.gpg"
# source_file = "/etc/apt/sources.list.d/rsenvforge.sources"
#
# 如果同一系统的不同架构需要不同镜像，可以使用 rules。
# 未在 rule 中填写的 suites/components/architectures/signed_by/source_file
# 会继承 [apt_mirror] 中的默认值；规则按书写顺序匹配，命中第一条即使用。
# [[apt_mirror.rules]]
# distribution = "ubuntu"
# architecture = "amd64"
# uri = "https://apt-amd64.internal.example/ubuntu"
#
# [[apt_mirror.rules]]
# distribution = "ubuntu"
# architecture = "arm64"
# uri = "https://apt-arm64.internal.example/ubuntu"
#
# 方式二：传统 deb 行 .list 模式。适合内网直接提供多行 deb 配置的情况。
# 若不同系统/架构的行不一样，把 lines 写进对应 rule。
# [apt_mirror]
# source_file = "/etc/apt/sources.list.d/rsenvforge.list"
# lines = [
#   "deb https://apt.internal.example/ubuntu {codename} main restricted universe multiverse",
#   "deb https://apt.internal.example/ubuntu {codename}-updates main restricted universe multiverse",
# ]
#
# [[apt_mirror.rules]]
# distribution = "ubuntu"
# architecture = "amd64"
# lines = [
#   "deb https://apt-amd64.internal.example/ubuntu {codename} main restricted universe multiverse",
#   "deb https://apt-amd64.internal.example/ubuntu {codename}-updates main restricted universe multiverse",
# ]

# [[apt_mirror.rules]]
# distribution = "ubuntu"
# architecture = "arm64"
# lines = [
#   "deb https://apt-arm64.internal.example/ubuntu {codename} main restricted universe multiverse",
#   "deb https://apt-arm64.internal.example/ubuntu {codename}-updates main restricted universe multiverse",
# ]

# 工具标签检查。只有在具体工具中显式填写 tags = ["名称"] 才会执行。
[tag_checks.proxy]
check_windows = "powershell -NoProfile -Command \"if ($env:http_proxy -or $env:https_proxy -or $env:HTTP_PROXY -or $env:HTTPS_PROXY) { exit 0 } else { exit 1 }\""
check_linux = "sh -lc 'test -n \"$http_proxy$https_proxy$HTTP_PROXY$HTTPS_PROXY\"'"

[tag_checks.github]
check_windows = "git ls-remote https://github.com/github/gitignore.git HEAD"
check_linux = "git ls-remote https://github.com/github/gitignore.git HEAD"

[tag_checks.npm]
check_windows = "npm --version"
check_linux = "npm --version"

[tag_checks.node20]
check_windows = "powershell -NoProfile -Command \"node -e \\\"const major = Number(process.versions.node.split('.')[0]); console.log(process.version); process.exit(major >= 20 ? 0 : 1)\\\"\""
check_linux = "node -e 'const major = Number(process.versions.node.split(\".\")[0]); console.log(process.version); process.exit(major >= 20 ? 0 : 1)'"

# 镜像标签不会自动绑定到工具。需要时请在对应 [[tools]] 中显式填写，
# 例如：tags = ["cargo-mirror"]。

[tag_checks.rustup-mirror]
check_windows = "powershell -NoProfile -Command \"rustup --version; if (-not $env:RUSTUP_DIST_SERVER) { exit 1 }; $url = $env:RUSTUP_DIST_SERVER.TrimEnd('/') + '/dist/channel-rust-stable.toml'; curl.exe -fsS --connect-timeout 10 $url > $null; exit $LASTEXITCODE\""
check_linux = "if [ -f \"$HOME/.bashrc\" ]; then . \"$HOME/.bashrc\" >/dev/null 2>&1 || true; fi; rustup --version || exit $?; test -n \"$RUSTUP_DIST_SERVER\" && curl -fsS --connect-timeout 10 \"${RUSTUP_DIST_SERVER%/}/dist/channel-rust-stable.toml\" >/dev/null"

[tag_checks.cargo-mirror]
check_windows = "powershell -NoProfile -Command \"cargo --version; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $home = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }; $config = Join-Path $home 'config.toml'; if (!(Test-Path $config)) { $config = Join-Path $home 'config' }; if (!(Test-Path $config) -or -not (Select-String -Path $config -Pattern 'registries|source' -Quiet)) { exit 1 }; cargo search serde --limit 1; exit $LASTEXITCODE\""
check_linux = "cargo --version || exit $?; config=\"${CARGO_HOME:-$HOME/.cargo}/config.toml\"; if [ ! -f \"$config\" ]; then config=\"${CARGO_HOME:-$HOME/.cargo}/config\"; fi; test -s \"$config\" && grep -Eq 'registries|source' \"$config\" && cargo search serde --limit 1"

[tag_checks.cargo-install]
check_windows = "cargo install --list"
check_linux = "cargo install --list"

# 用于校验 nvm 下载镜像；只有在具体工具 tags 中显式引用 nvm-mirror 时才会执行。
[tag_checks.nvm-mirror]
check_windows = "powershell -NoProfile -Command \"nvm version; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $root = if ($env:NVM_HOME) { $env:NVM_HOME } else { Join-Path $env:APPDATA 'nvm' }; $settings = Join-Path $root 'settings.txt'; if (!(Test-Path $settings)) { exit 1 }; $line = Select-String -Path $settings -Pattern '^node_mirror:\\s*(.+)$' | Select-Object -First 1; if ($null -eq $line) { exit 1 }; $url = $line.Matches[0].Groups[1].Value.Trim().TrimEnd('/'); curl.exe -fsS --connect-timeout 10 ($url + '/index.tab') > $null; exit $LASTEXITCODE\""
check_linux = "nvm --version && test -n \"$NVM_NODEJS_ORG_MIRROR\" && curl -fsS --connect-timeout 10 \"${NVM_NODEJS_ORG_MIRROR%/}/index.tab\" >/dev/null && nvm ls-remote 20.17.0 | grep -q 'v20.17.0'"

[tag_checks.apt-mirror]
check_windows = "0"
check_linux = "command -v apt-get >/dev/null || exit 1; tmp=$(mktemp -d) || exit 1; mkdir -p \"$tmp/partial\"; apt-get -o \"Dir::State::lists=$tmp\" update; status=$?; rm -rf \"$tmp\"; exit $status"

[tag_checks.npm-mirror]
check_windows = "powershell -NoProfile -Command \"npm --version; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $registry = (npm config get registry).Trim(); if ([string]::IsNullOrWhiteSpace($registry) -or $registry -eq 'null') { exit 1 }; npm ping --registry $registry; exit $LASTEXITCODE\""
check_linux = "npm --version || exit $?; registry=$(npm config get registry); test -n \"$registry\" && test \"$registry\" != \"null\" && npm ping --registry \"$registry\""

