[preinstall.standard.linux]
commands = [
  "sudo apt-get update",
  "sudo apt-get install -y pkg-config libssl-dev",
]

[preinstall.standard.windows]
commands = []

[[tools]]
name = "rust"
check_windows = "rustup --version"
check_linux = "rustup --version"
install_windows = "rustup toolchain install stable && rustup component add rustfmt clippy"
install_linux = "rustup toolchain install stable && rustup component add rustfmt clippy"

[[tools]]
name = "cargo-llvm-cov"
check_windows = "cargo llvm-cov --version"
check_linux = "cargo llvm-cov --version"
install_windows = "cargo install cargo-llvm-cov"
install_linux = "cargo install cargo-llvm-cov"

[[tools]]
name = "bindgen-cli"
check_windows = "bindgen --version"
check_linux = "bindgen --version"
install_windows = "cargo install bindgen-cli"
install_linux = "cargo install bindgen-cli"

[[tools]]
name = "cargo-audit"
check_windows = "cargo audit --version"
check_linux = "cargo audit --version"
install_windows = "cargo install cargo-audit"
install_linux = "cargo install cargo-audit"

[[tools]]
